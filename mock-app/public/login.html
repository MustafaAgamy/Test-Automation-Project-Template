<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex;
           justify-content: center; align-items: center; height: 100vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.12); width: 340px; }
    h1 { margin-bottom: 1.5rem; font-size: 1.4rem; text-align: center; }
    label { display: block; font-size: .85rem; margin-bottom: .25rem; color: #555; }
    input { width: 100%; padding: .6rem .75rem; margin-bottom: 1rem;
            border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button[type="submit"] { width: 100%; padding: .7rem; background: #2563eb;
                            color: #fff; border: none; border-radius: 4px;
                            font-size: 1rem; cursor: pointer; }
    button[type="submit"]:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign In</h1>
    <form action="/api/auth/login" method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="demo@example.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>

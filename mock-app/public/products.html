<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 2rem; }
    .dashboard { max-width: 860px; margin: 0 auto; }
    h1 { margin-bottom: 1rem; font-size: 1.6rem; }
    #create-product-btn { padding: .5rem 1rem; background: #2563eb; color: #fff;
                          border: none; border-radius: 4px; cursor: pointer;
                          margin-bottom: 1rem; font-size: .9rem; }
    #create-product-btn:hover { background: #1d4ed8; }
    #create-form { background: #fff; border: 1px solid #ddd; border-radius: 6px;
                   padding: 1rem; margin-bottom: 1.5rem; display: none; }
    #create-form h2 { font-size: 1rem; margin-bottom: .75rem; }
    #create-form input { width: 100%; padding: .5rem .65rem; margin-bottom: .75rem;
                         border: 1px solid #ccc; border-radius: 4px; font-size: .95rem; }
    #save-product-btn { padding: .5rem 1.2rem; background: #16a34a; color: #fff;
                        border: none; border-radius: 4px; cursor: pointer; font-size: .9rem; }
    .alert-success { margin-top: .75rem; padding: .5rem .75rem; background: #dcfce7;
                     color: #166534; border-radius: 4px; display: none; font-size: .9rem; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 6px; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    th { background: #f1f5f9; text-align: left; padding: .65rem 1rem;
         font-size: .85rem; color: #475569; }
    td { padding: .65rem 1rem; border-top: 1px solid #f1f5f9; font-size: .9rem; }
    td.product-status span { padding: .2rem .55rem; background: #dcfce7;
                             color: #166534; border-radius: 999px; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>Products</h1>

    <button id="create-product-btn">+ Create Product</button>

    <div id="create-form">
      <h2>New Product</h2>
      <input type="text"   id="product-name"  placeholder="Product name"  required>
      <input type="text"   id="product-sku"   placeholder="SKU"            required>
      <input type="number" id="product-price" placeholder="Price" step="0.01" required>
      <button id="save-product-btn">Save</button>
      <div class="alert-success" id="success-msg">Product created successfully</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>SKU</th><th>Price</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="products-body"></tbody>
    </table>
  </div>

  <script>
    const searchParam = new URLSearchParams(window.location.search).get('search') || '';

    function renderRows(data) {
      const filtered = searchParam
        ? data.filter(p => p.name.includes(searchParam))
        : data;
      document.getElementById('products-body').innerHTML = filtered.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>${p.sku}</td>
          <td>${p.price}</td>
          <td class="product-status"><span>${p.status}</span></td>
        </tr>`).join('');
    }

    async function loadProducts() {
      const res = await fetch('/api/products');
      if (res.status === 401) { window.location = '/'; return; }
      renderRows(await res.json());
    }

    document.getElementById('create-product-btn').addEventListener('click', () => {
      document.getElementById('create-form').style.display = 'block';
    });

    document.getElementById('save-product-btn').addEventListener('click', async () => {
      const name  = document.getElementById('product-name').value;
      const sku   = document.getElementById('product-sku').value;
      const price = document.getElementById('product-price').value;
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, sku, price })
      });
      if (res.ok) {
        document.getElementById('success-msg').style.display = 'block';
        loadProducts();
      }
    });

    loadProducts();
  </script>
</body>
</html>

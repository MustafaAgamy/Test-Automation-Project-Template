name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  setup:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn test-compile -q

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock app
        run: |
          cd mock-app && npm ci --silent
          node server.js &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 1; done'
          echo "Mock app ready"

      - name: Run API tests
        run: |
          mvn test \
            -Dgroups=api \
            -DbaseUri=http://localhost:3000/ \
            -DapiKey=demo-api-key \
            -DgenerateAllureReportArchive=true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report/*.html
          if-no-files-found: ignore
          retention-days: 7

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock app
        run: |
          cd mock-app && npm ci --silent
          node server.js &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 1; done'
          echo "Mock app ready"

      # Chrome runs inside Docker; both Maven (host) and Chrome must reach
      # the mock app and the Grid via the host's primary IP.
      - name: Resolve host IP for Docker containers
        run: echo "HOST_IP=$(hostname -I | awk '{print $1}')" >> $GITHUB_ENV

      # SE_NODE_GRID_URL tells the Chrome node what externally-accessible
      # Grid URL to advertise when registering. The Hub embeds this in the
      # webSocketUrl capability returned to the Selenium client (used by
      # SHAFT's BiDi navigation). Must be set before the node starts.
      - name: Start Selenium Grid
        run: SE_NODE_GRID_URL=http://$HOST_IP:4444 docker compose up -d selenium-hub chrome

      - name: Wait for Selenium Grid
        run: timeout 60 bash -c 'until curl -sf http://localhost:4444/wd/hub/status > /dev/null; do sleep 2; done'

      - name: Run browser tests
        run: |
          mvn test \
            -Dgroups=browser \
            -DbaseUri=http://$HOST_IP:3000/ \
            -DapiKey=demo-api-key \
            -DexecutionAddress=http://localhost:4444 \
            -DgenerateAllureReportArchive=true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-browser
          path: allure-report/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down selenium-hub chrome

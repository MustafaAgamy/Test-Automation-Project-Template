name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  setup:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn test-compile -q

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock app
        run: |
          cd mock-app && npm ci --silent
          node server.js &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 1; done'
          echo "Mock app ready"

      - name: Run API tests
        run: |
          mvn test \
            -Dgroups=api \
            -DbaseUri=http://localhost:3000/ \
            -DapiKey=demo-api-key \
            -DgenerateAllureReportArchive=true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report/*.html
          if-no-files-found: ignore
          retention-days: 7

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock app
        run: |
          cd mock-app && npm ci --silent
          node server.js &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 1; done'
          echo "Mock app ready"

      # The Hub's BiDi WebSocket relay URL contains "selenium-hub" (the
      # Docker hostname). Adding it to /etc/hosts lets the Maven process
      # resolve it to the published port without Grid config changes.
      - name: Map selenium-hub hostname to localhost
        run: echo "127.0.0.1 selenium-hub" | sudo tee -a /etc/hosts

      - name: Start Selenium Grid
        run: docker compose up -d selenium-hub chrome

      - name: Wait for Selenium Grid
        run: timeout 60 bash -c 'until curl -sf http://localhost:4444/wd/hub/status > /dev/null; do sleep 2; done'

      # Mock app runs on the host but Chrome runs inside Docker.
      # Chrome cannot use "localhost" (its own loopback), so we pass the
      # host's primary IP so both Maven API calls and Chrome navigation
      # reach the same mock app instance.
      - name: Resolve host IP for Docker containers
        run: echo "HOST_IP=$(hostname -I | awk '{print $1}')" >> $GITHUB_ENV

      - name: Run browser tests
        run: |
          mvn test \
            -Dgroups=browser \
            -DbaseUri=http://$HOST_IP:3000/ \
            -DapiKey=demo-api-key \
            -DexecutionAddress=http://localhost:4444 \
            -DgenerateAllureReportArchive=true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-browser
          path: allure-report/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down selenium-hub chrome
